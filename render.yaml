# Render deploy config for the backend web service.
#
# Durable state (watchlist, saved screens, alerts, paper trades, fundamentals
# cache) lives wherever DATABASE_URL points db.py: set -> Postgres, unset ->
# local SQLite. This does NOT provision a database — set DATABASE_URL
# manually in the Render dashboard (Environment tab) pointing at a real
# Postgres instance such as the project's Supabase session pooler. URL-encode
# reserved characters in the password before putting it in DATABASE_URL.
#
# Without DATABASE_URL set, the free web plan's ephemeral disk wipes the
# local SQLite file on every restart/redeploy — this has already happened
# once in production because the variable was never actually added. Check
# the backend's startup logs for "[db] Using..." to confirm which backend is
# actually active before assuming this is fixed.
#
# (An earlier version of this file provisioned Render's own free Postgres via
# a `databases:` Blueprint block wired through `fromDatabase:` — removed
# because it only takes effect on a Blueprint-style deploy, doesn't match how
# this service is actually run, expires after ~30 days regardless, and would
# silently override a manually-set DATABASE_URL if a Blueprint deploy were
# ever used later.)

services:
  - type: web
    name: stock-research
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Set manually in the Render dashboard -> Environment tab. Point it at
      # the Supabase session-pooler connection string. Left unset here on
      # purpose — secrets must stay in Render, never in this repository.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: 6
      # Never silently accept writes into ephemeral SQLite when Supabase is
      # unavailable. Render will restart the service instead.
      - key: ALLOW_EPHEMERAL_DB_FALLBACK
        value: false
      - key: CRON_SECRET_KEY
        sync: false   # same value as GitHub secret STOCKLENS_CRON_SECRET
      - key: GEMINI_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional: only used by the SQLite fallback (when DATABASE_URL is unset).
      # - key: STOCKLENS_DATA_DIR
      #   value: /var/data
