name: Daily StockLens CFO snapshot

on:
  schedule:
    # 07:00 IST, Monday-Friday. The job uses the latest completed NSE session;
    # provider failures retain the last valid immutable snapshot.
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend and start the CFO snapshot pipeline
        env:
          GITHUB_JOB_TOKEN: ${{ github.token }}
          GITHUB_RUN_IDENTIFIER: ${{ github.run_id }}
        run: |
          test -n "$GITHUB_JOB_TOKEN"
          test -n "$GITHUB_RUN_IDENTIFIER"
          curl --fail-with-body --show-error --silent \
            --retry 4 --retry-all-errors --retry-delay 15 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $GITHUB_JOB_TOKEN" \
            -H "X-GitHub-Run-ID: $GITHUB_RUN_IDENTIFIER" \
            https://stock-research-vtmf.onrender.com/api/jobs/daily/run
