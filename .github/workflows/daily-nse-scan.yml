name: Daily StockLens swing snapshot

on:
  schedule:
    # Queue at 02:00 IST, Monday-Friday, so GitHub's observed multi-hour
    # schedule delay still lands before the morning decision window. The job
    # always anchors to the latest completed NSE session, so an on-time run
    # and a delayed run analyse the same finished market data.
    - cron: '30 20 * * 0-4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend and start the morning snapshot pipeline
        env:
          GITHUB_JOB_TOKEN: ${{ github.token }}
          GITHUB_RUN_IDENTIFIER: ${{ github.run_id }}
        run: |
          test -n "$GITHUB_JOB_TOKEN"
          test -n "$GITHUB_RUN_IDENTIFIER"
          curl --fail-with-body --show-error --silent \
            --retry 4 --retry-all-errors --retry-delay 15 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $GITHUB_JOB_TOKEN" \
            -H "X-GitHub-Run-ID: $GITHUB_RUN_IDENTIFIER" \
            https://stock-research-vtmf.onrender.com/api/jobs/daily/run
